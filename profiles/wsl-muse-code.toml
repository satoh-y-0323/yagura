# Runs Muse Code inside a WSL distribution. Windows only (see
# wsl-claude-code.toml for why this profile carries no other operating
# system's argv). The shell is both a login and an interactive shell so
# `~/.bashrc` runs too, which is where a tool such as nvm adds its own
# install to `PATH`.
# Checked with Muse Code 1.4.12. Nothing is registered: the user's own
# settings file stays untouched, and every launch passes the bridge and the
# hooks with -c instead.
schema = 1
display_name = "WSL: Muse Code"
detection = "muse-code"

[command]
windows = ["wsl", "-e", "bash", "-lic", "exec \"$0\" \"$@\"", "muse"]

[model]
args = ["--model", "{value}"]

[model.aliases]
fast = "muse-spark-1.3"
default = "muse-spark-1.3"
strong = "muse-wonder-1.0"

# Muse lists no models through a command, so the choices are fixed.
[model.choices]
values = ["muse-spark-1.3", "muse-wonder-1.0", "muse-spark-1.2"]

# No [effort]: Muse has no way to set it for one launch. `--reasoning-effort`
# is saved as the user's own default, and `-c reasoning_effort=...` is ignored
# unless the user's settings already hold that key (Muse Code 1.4.12). Measure
# again with each Muse release; once `-c` takes effect on its own, map it here.

# Muse hands its MCP server only the variables named in `env` and refuses the
# whole launch over a `${VAR}` that is unset, so `{env_refs}` names only what
# the window really has. `tool_timeout_sec` is not a key `-c` accepts here. A
# server of the same name in the user's settings also makes Muse refuse the
# launch, so `absent` drops this injection in that case.
[mcp]
args = ["-c", "mcpServers.{server}={\"transport\":\"stdio\",\"command\":{bridge_json},\"args\":[],\"env\":{env_refs},\"mode\":\"optional\"}"]
absent = { file = ".config/muse/settings.json", pointer = "/mcpServers/{server}" }

# This file is read only through this launch's -c, so its commands need no
# check for being inside a window. It replaces the user's own
# `managed_hooks_path` for this window only.
[hooks]
config_file = '{"hooks":{"SessionStart":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --deliver-context","timeout":10}]}],"UserPromptSubmit":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --emit-status running --source muse-code","timeout":10},{"type":"command","command":"yagura-daemon.exe --deliver-take","timeout":10}]}],"PermissionRequest":[{"matcher":"*","hooks":[{"type":"command","command":"yagura-daemon.exe --emit-status waiting_approval --source muse-code","timeout":10}]}],"Stop":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --emit-status waiting_input --source muse-code","timeout":10}]}],"StopFailure":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --emit-status waiting_input --source muse-code","timeout":10}]}],"Interrupt":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --emit-status waiting_input --source muse-code","timeout":10,"async":true}]}]}}'
args = [
  "-c", "managed_hooks_path=\"{hooks_config_file}\"",
  "-c", "managed_hooks_env_vars=[\"YAGURA_WINDOW_ID\",\"YAGURA_STATUS_TOKEN\",\"YAGURA_INSTANCE\"]",
]

# SessionStart runs on the first prompt, not at start-up. Muse takes plain
# text from a hook too; the JSON form names the event the text arrives for.
[delivery]
max_chars = 10000
wake = "none"
launch_prompt = ["--", "{prompt}"]

[delivery.output]
context = '{"hookSpecificOutput":{"hookEventName":"SessionStart","additionalContext":{text}}}'
take = '{"hookSpecificOutput":{"hookEventName":"UserPromptSubmit","additionalContext":{text}}}'

# A Windows path is unreadable from the WSL CLI as it is: the bridge and the
# hook file are converted with WSL's own tool. `{file}` is a positional
# argument to `sh`, resolved against $HOME inside the script, never spliced
# into it.
[host_paths]
convert = ["wsl", "-e", "wslpath", "-u", "{path}"]
read = ["wsl", "-e", "sh", "-c", 'f="$HOME/$1"; [ -e "$f" ] || exit 3; exec cat -- "$f"', "sh", "{file}"]
absent_exit = 3
