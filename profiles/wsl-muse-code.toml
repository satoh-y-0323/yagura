# Runs Muse Code inside a WSL distribution. Windows only (see
# wsl-claude-code.toml for why this profile carries no other operating
# system's argv). The shell is both a login and an interactive shell so
# `~/.bashrc` runs too, which is where a tool such as nvm adds its own
# install to `PATH`.
# Checked with Muse Code 1.4.12. Nothing is registered: the user's own
# settings file stays untouched, and every launch passes the bridge and the
# hooks with -c instead.
schema = 1
display_name = "WSL: Muse Code"
detection = "muse-code"

[command]
windows = ["wsl", "-e", "bash", "-lic", "exec \"$0\" \"$@\"", "muse"]

[model]
args = ["--model", "{value}"]

[model.aliases]
fast = "muse-spark-1.3"
default = "muse-spark-1.3"
strong = "muse-wonder-1.0"

# Muse lists no models through a command, so the choices are fixed.
[model.choices]
values = ["muse-spark-1.3", "muse-wonder-1.0", "muse-spark-1.2"]

# No [effort]: Muse has no way to set it for one launch. `--reasoning-effort`
# is saved as the user's own default, and `-c reasoning_effort=...` is ignored
# unless the user's settings already hold that key (Muse Code 1.4.12 to 1.4.14). Measure
# again with each Muse release; once `-c` takes effect on its own, map it here.

# The window's identity reaches the hooks and the MCP bridge as the credentials
# file's path in their arguments, not through the environment, so the CLIs
# the window's tools start do not inherit it.
[credentials]
mode = "launch"

# Muse hands its MCP server only the variables named in `env` and refuses the
# whole launch over a `${VAR}` that is unset, so `{env_refs}` names only what
# the window really has. `tool_timeout_sec` is not a key `-c` accepts here. A
# server of the same name in the user's settings also makes Muse refuse the
# launch, so `absent` drops this injection in that case.
[mcp]
args = ["-c", "mcpServers.{server}={\"transport\":\"stdio\",\"command\":{bridge_json},\"args\":[\"--profile\",\"wsl-muse-code\",\"--credentials\",\"{credentials_file}\"],\"env\":{env_refs},\"mode\":\"optional\"}"]
absent = { file = ".config/muse/settings.json", pointer = "/mcpServers/{server}" }

# This file is read only through this launch's -c, so its commands need no
# check for being inside a window. It replaces the user's own
# `managed_hooks_path` for this window only.
[hooks]
config_file = '''{"hooks":{"SessionStart":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --deliver-context","timeout":{hook_timeout}}]}],"UserPromptSubmit":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --hook wsl-muse-code UserPromptSubmit","timeout":{hook_timeout}}]}],"PermissionRequest":[{"matcher":"*","hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --emit-status waiting_approval --source muse-code","timeout":{hook_timeout}}]}],"Stop":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --hook wsl-muse-code Stop","timeout":{hook_timeout}}]}],"StopFailure":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --hook wsl-muse-code StopFailure","timeout":{hook_timeout}}]}],"Interrupt":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --hook wsl-muse-code Interrupt","timeout":{hook_timeout},"async":true}]}],"PostToolUse":[{"matcher":"*","hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --hook wsl-muse-code PostToolUse","timeout":{hook_timeout}}]}],"PostToolUseFailure":[{"matcher":"*","hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --hook wsl-muse-code PostToolUseFailure","timeout":{hook_timeout}}]}]}}'''
args = [
  "-c", "managed_hooks_path=\"{hooks_config_file}\"",
  "-c", "managed_hooks_env_vars=[\"YAGURA_INSTANCE\"]",
]

# The seconds this CLI gives a hook command. The registered entries name it
# through `{hook_timeout}`, and the daemon names it to a door that asks, so
# the two are one value.
[hook_timeout]
default = 10

# SessionStart runs on the first prompt, not at start-up. Muse takes plain
# text from a hook too; the JSON form names the event the text arrives for.
[delivery]
max_bytes = 10000
wake = "none"
launch_prompt = ["--", "{prompt}"]

[delivery.output]
context = '{"hookSpecificOutput":{"hookEventName":"SessionStart","additionalContext":{text}}}'
take = '{"hookSpecificOutput":{"hookEventName":"UserPromptSubmit","additionalContext":{text}}}'
block = '{"decision":"block","reason":{text}}'

# A Windows path is unreadable from the WSL CLI as it is: the bridge and the
# hook file are converted with WSL's own tool. `{file}` is a positional
# argument to `sh`, resolved against $HOME inside the script, never spliced
# into it.
[host_paths]
convert = ["wsl", "-e", "wslpath", "-u", "{path}"]
read = ["wsl", "-e", "sh", "-c", 'f="$HOME/$1"; [ -e "$f" ] || exit 3; exec cat -- "$f"', "sh", "{file}"]
absent_exit = 3

# The Stop hook calls the `--hook` door, so its status and its block are one
# handler: a second handler's status could land after the block's. The events
# that start and end a turn call it too, for [interrupt].
[hook_events]
UserPromptSubmit = { status = "running", deliver = "take" }
Stop = { status = "waiting_input", deliver = "block", when = { "/stop_hook_active" = false } }
StopFailure = { status = "waiting_input" }
Interrupt = { status = "waiting_input" }
# Declared only to be stopped at ([interrupt]): no status, delivery or session.
PostToolUse = {}
PostToolUseFailure = {}

# How the user and an AI stop the CLI. The user's own interrupt types Escape.
# An AI's marks the window's open turn, and each tool result of that turn is
# answered with a stop until the turn ends. Muse tells no subagent's hook
# apart, so no answer may end the turn: the stop answers stop a subagent alone
# (measured), and the turn ends at `Interrupt` or `Stop`.
[interrupt]
user_keys = ["escape"]
ai = "hook"

[interrupt.turn]
starts = ["UserPromptSubmit"]
ends = ["Stop", "StopFailure", "Interrupt"]

[interrupt.stops.PostToolUse]
answer = '{"continue":false,"stopReason":{reason}}'
ends_turn = false

[interrupt.stops.PostToolUseFailure]
answer = '{"continue":false,"stopReason":{reason}}'
ends_turn = false
