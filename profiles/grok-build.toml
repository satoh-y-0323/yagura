# Launches Grok Build directly. Requires `grok` to be resolvable on the
# daemon's PATH (or its extra bin directories on Windows).
# The launch options below follow `grok --help` (1.0.70). Model names change
# over time -- edit the aliases to match what your own account can run.
# No approval-skip, `--trust` or `--no-auto-update` flag: each would change a
# decision that is the user's own (approvals, folder trust, updates).
schema = 1
display_name = "Grok Build"
detection = "grok-build"
# A sub-agent's hooks carry `subagentType`: the daemon reports their running and
# waiting for approval, and does nothing else for them.
subagent_pointer = "/subagentType"

[command]
default = ["grok"]

# Grok Build also runs Claude Code's and Cursor's hooks and MCP servers.
# Switched off for the window so it runs only the ones registered for Grok
# Build; skills, rules and agents are still read (checked with 1.0.70).
[env]
GROK_CLAUDE_HOOKS_ENABLED = "false"
GROK_CLAUDE_MCPS_ENABLED = "false"
GROK_CURSOR_HOOKS_ENABLED = "false"
GROK_CURSOR_MCPS_ENABLED = "false"

# `-m` saves the model as the user's own default; the variable selects it for
# this launch only (1.0.70).
[model]
env = { GROK_DEFAULT_MODEL = "{value}" }

[model.aliases]
fast = "grok-4.7-build-fast"
default = "grok-4.7"
strong = "grok-4.7"

# Grok Build lists no models in a machine-readable form, so the choices are
# fixed. Once `grok models` prints JSON, list them through that command.
[model.choices]
values = ["grok-4.7", "grok-4.7-build-fast", "grok-4.6", "grok-4.5"]

# A level the model does not take falls back to its default without stopping
# the launch (1.0.70).
[effort]
args = ["--reasoning-effort", "{value}"]

# The window's credentials are in its environment, which Grok Build hands its
# tools' shells. The overlay a window is handed in GROK_CONFIG keeps them (and
# the overlay's own variables) from those shells: it is the user's own overlay
# with `shell_environment_policy.exclude` made the union of every exclude the
# layers below it hold and those names, since the overlay replaces their lists.
# The layers are `config.toml` and the managed settings in GROK_HOME (or
# ~/.grok) and /etc/grok. An empty or malformed GROK_CONFIG falls through to
# GROK_CONFIG_PATH, read as JSON when it ends in .json and as TOML otherwise
# (05-configuration.md and 10-hooks.md, 1.0.70).
[launch_overlay]
env = "GROK_CONFIG"
file_env = "GROK_CONFIG_PATH"
dir_env = "GROK_HOME"
dir = ".grok"
layers = ["config.toml", "managed_config.toml", "/etc/grok/managed_config.toml"]
list = "/shell_environment_policy/exclude"

# Hook output reaches the model only from the tool-call hooks, not at session
# start or prompt submit (1.0.70), so the start-up context goes in as `--rules`
# and other text waits for the next call. Grok has no way to wake an idle
# session, so `wake` stays `none`.
[delivery]
output = { context = '{"hookSpecificOutput":{"additionalContext":{text}}}', take = '{"hookSpecificOutput":{"additionalContext":{text}}}', wait = '{"hookSpecificOutput":{"additionalContext":{text}}}', block = '{"decision":"block","reason":{text}}' }
max_bytes = 10000
wake = "none"
launch_context = ["--rules", "{context}"]
launch_prompt = ["--", "{prompt}"]

[mcp_registration]
add = ["mcp", "add", "{env_args}", "{server}", "--", "{bridge}", "--profile", "grok-build"]
remove = ["mcp", "remove", "{server}"]
env_arg = ["--env={env}"]
notice = "While this is registered, Grok Build asks whether to trust every folder it starts in outside your home directory, including sessions you start yourself. Answering yes also lets that folder's own hooks, MCP servers and instructions run."

[mcp_registration.status]
args = ["mcp", "list", "--json"]
format = "json"
items = ""
name = "/name"
command = "/command"
args_pointer = "/args"

# Every grok session sees every registered server; a window turns off the
# ones of other instances. A denied server's tools still show by name in
# `search_tool` but cannot be called (1.0.70).
[mcp_registration.list]
args = ["mcp", "list", "--json"]
items = ""
name = "/name"
command = "/command"
disable = ["--deny", "MCPTool({server}__*)"]

# `tool_timeout_sec` keeps a long `wait_for_status` from being cut off.
[mcp_registration.toml_set]
file = ".grok/config.toml"
table = ["mcp_servers", "{server}"]
values = { tool_timeout_sec = 86400 }
confirm = {}

# One hooks file per instance, so removing one registration leaves the others.
# The handlers run the daemon directly with `args` (no shell), so outside a
# window the daemon itself does nothing. A sub-agent's session runs these hooks
# too; `subagent_pointer` tells it apart by its `subagentType` payload key. The order of
# events and the approval notification follow a real session (1.0.70).
# The inbox is taken once a call has run, where its output reaches the model.
[mcp_registration.json_entry]
file = ".grok/hooks/{server}.json"

[mcp_registration.json_entry.entries."/hooks"]
UserPromptSubmit = [{ hooks = [{ type = "command", command = "{daemon}", args = ["--for-instance", "{server}", "--hook", "grok-build", "UserPromptSubmit"], timeout = "{hook_timeout}" }] }]
PreToolUse = [{ hooks = [{ type = "command", command = "{daemon}", args = ["--for-instance", "{server}", "--hook", "grok-build", "PreToolUse"], timeout = "{hook_timeout}" }] }]
PostToolUse = [{ hooks = [{ type = "command", command = "{daemon}", args = ["--for-instance", "{server}", "--hook", "grok-build", "PostToolUse"], timeout = "{hook_timeout}" }] }]
PostToolUseFailure = [{ hooks = [{ type = "command", command = "{daemon}", args = ["--for-instance", "{server}", "--hook", "grok-build", "PostToolUseFailure"], timeout = "{hook_timeout}" }] }]
Notification = [{ matcher = "permission_prompt", hooks = [{ type = "command", command = "{daemon}", args = ["--for-instance", "{server}", "--hook", "grok-build", "Notification"], timeout = "{hook_timeout}" }] }]
Stop = [{ hooks = [{ type = "command", command = "{daemon}", args = ["--for-instance", "{server}", "--hook", "grok-build", "Stop"], timeout = "{hook_timeout}" }] }]
StopFailure = [{ hooks = [{ type = "command", command = "{daemon}", args = ["--for-instance", "{server}", "--hook", "grok-build", "StopFailure"], timeout = "{hook_timeout}" }] }]
StopCancelled = [{ hooks = [{ type = "command", command = "{daemon}", args = ["--for-instance", "{server}", "--hook", "grok-build", "StopCancelled"], timeout = "{hook_timeout}" }] }]

# The seconds this CLI gives a hook command. The registered entries name it
# through `{hook_timeout}`, and the daemon names it to a door that asks, so
# the two are one value.
[hook_timeout]
default = 10

[hook_events]
UserPromptSubmit = { status = "running" }
PreToolUse = { status = "running" }
PostToolUse = { status = "running", deliver = "take" }
PostToolUseFailure = { status = "running", deliver = "take" }
Notification = { status = "waiting_approval" }
Stop = { status = "waiting_input", deliver = "block", when = { "/stop_hook_active" = false, "/stopHookActive" = false } }
StopFailure = { status = "waiting_input" }
StopCancelled = { status = "waiting_input" }

# How the user and an AI stop the CLI. The user's own interrupt types Ctrl+C.
# An AI's marks the window's open turn, and its tool calls are answered with a
# stop until the turn ends. Only the answer to `PostToolUse` was measured to
# end the turn; `PostToolUseFailure` could not be raised to measure, so it is
# not stopped at.
[interrupt]
user_keys = ["ctrl_c"]
ai = "hook"

[interrupt.turn]
starts = ["UserPromptSubmit"]
ends = ["Stop", "StopFailure", "StopCancelled"]

[interrupt.stops.PreToolUse]
answer = '{"continue":false,"stopReason":{reason}}'
ends_turn = false

[interrupt.stops.PostToolUse]
answer = '{"continue":false,"stopReason":{reason}}'
ends_turn = true
