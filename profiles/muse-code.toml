# Launches Muse Code directly. Requires `muse` to be resolvable on the
# daemon's PATH (or its extra bin directories on Windows).
# Checked with Muse Code 1.4.12. Muse has no registration command, so on
# every OS the bridge and the hooks are written to its settings files (see
# [mcp_registration]) and nothing is injected at launch.
schema = 1
display_name = "Muse Code"
detection = "muse-code"

[command]
default = ["muse"]

[model]
args = ["--model", "{value}"]

[model.aliases]
fast = "muse-spark-1.3"
default = "muse-spark-1.3"
strong = "muse-wonder-1.0"

# Muse lists no models through a command, so the choices are fixed.
[model.choices]
values = ["muse-spark-1.3", "muse-wonder-1.0", "muse-spark-1.2"]

# No [effort]: Muse has no way to set it for one launch. `--reasoning-effort`
# is saved as the user's own default, and `-c reasoning_effort=...` is ignored
# unless the user's settings already hold that key (Muse Code 1.4.12). Measure
# again with each Muse release; once `-c` takes effect on its own, map it here.

# On Windows `muse.cmd` wraps PowerShell 5.1, which drops `"` and `--` from
# the arguments, so the start-up request cannot reach the CLI. Measure again
# once Muse's Windows entry point passes `"`, `--` and arbitrary arguments
# through unchanged; then this limit can go.
[shim_guidance]
text = "On Windows, Muse Code's launcher cannot pass a start-up request; use the WSL: Muse Code profile (wsl-muse-code) for task windows and for a handoff that opens a new window."
url = "https://github.com/satoh-y-0323/yagura/blob/main/docs/mcp-setup.md#configuring-muse-code-cli"

# SessionStart runs on the first prompt, not at start-up. Muse takes plain
# text from a hook too; the JSON form names the event the text arrives for.
[delivery]
max_chars = 10000
wake = "none"
launch_prompt = ["--", "{prompt}"]

[delivery.output]
context = '{"hookSpecificOutput":{"hookEventName":"SessionStart","additionalContext":{text}}}'
take = '{"hookSpecificOutput":{"hookEventName":"UserPromptSubmit","additionalContext":{text}}}'

[mcp_registration.status]
file = ".config/muse/settings.json"
format = "json"
command = "/mcpServers/{server}/command"

# `managed_hooks_path` holds a single file, so it is claimed: a different
# value of the user's own is never overwritten. It and the variables below are
# shared by every instance and removed with the last registration.
# `tool_timeout_sec` keeps a long `wait_for_status` from being cut off.
[[mcp_registration.json_entry]]
file = ".config/muse/settings.json"
claim = "/managed_hooks_path"

[mcp_registration.json_entry.entries]
"/mcpServers/{server}" = { transport = "stdio", command = "{bridge}", args = [], env = "{env_refs}", mode = "optional", tool_timeout_sec = 86400 }
"/managed_hooks_path" = "yagura-managed-hooks.json"
"/managed_hooks_env_vars" = ["YAGURA_WINDOW_ID", "YAGURA_STATUS_TOKEN", "YAGURA_INSTANCE"]

# Managed hooks run in every Muse session of the user, ours or not. Outside a
# window `yagura-daemon` is not on PATH and each turn would show `Hook
# failed`, so the shell checks for the window first and does nothing
# otherwise. On Windows the same check also stops the working directory from
# being searched for a `yagura-daemon.bat`.
[[mcp_registration.json_entry]]
file = ".config/muse/yagura-managed-hooks.json"

[mcp_registration.json_entry.by_os.windows]
"/hooks" = { SessionStart = [{ hooks = [{ type = "command", command = "if defined YAGURA_WINDOW_ID (set NoDefaultCurrentDirectoryInExePath=1& yagura-daemon --deliver-context)", timeout = 10 }] }], UserPromptSubmit = [{ hooks = [{ type = "command", command = "if defined YAGURA_WINDOW_ID (set NoDefaultCurrentDirectoryInExePath=1& yagura-daemon --emit-status running --source muse-code)", timeout = 10 }, { type = "command", command = "if defined YAGURA_WINDOW_ID (set NoDefaultCurrentDirectoryInExePath=1& yagura-daemon --deliver-take)", timeout = 10 }] }], PermissionRequest = [{ matcher = "*", hooks = [{ type = "command", command = "if defined YAGURA_WINDOW_ID (set NoDefaultCurrentDirectoryInExePath=1& yagura-daemon --emit-status waiting_approval --source muse-code)", timeout = 10 }] }], Stop = [{ hooks = [{ type = "command", command = "if defined YAGURA_WINDOW_ID (set NoDefaultCurrentDirectoryInExePath=1& yagura-daemon --emit-status waiting_input --source muse-code)", timeout = 10 }] }], StopFailure = [{ hooks = [{ type = "command", command = "if defined YAGURA_WINDOW_ID (set NoDefaultCurrentDirectoryInExePath=1& yagura-daemon --emit-status waiting_input --source muse-code)", timeout = 10 }] }], Interrupt = [{ hooks = [{ type = "command", command = "if defined YAGURA_WINDOW_ID (set NoDefaultCurrentDirectoryInExePath=1& yagura-daemon --emit-status waiting_input --source muse-code)", timeout = 10, async = true }] }] }

[mcp_registration.json_entry.by_os.default]
"/hooks" = { SessionStart = [{ hooks = [{ type = "command", command = '[ -z "$YAGURA_WINDOW_ID" ] || exec yagura-daemon --deliver-context', timeout = 10 }] }], UserPromptSubmit = [{ hooks = [{ type = "command", command = '[ -z "$YAGURA_WINDOW_ID" ] || exec yagura-daemon --emit-status running --source muse-code', timeout = 10 }, { type = "command", command = '[ -z "$YAGURA_WINDOW_ID" ] || exec yagura-daemon --deliver-take', timeout = 10 }] }], PermissionRequest = [{ matcher = "*", hooks = [{ type = "command", command = '[ -z "$YAGURA_WINDOW_ID" ] || exec yagura-daemon --emit-status waiting_approval --source muse-code', timeout = 10 }] }], Stop = [{ hooks = [{ type = "command", command = '[ -z "$YAGURA_WINDOW_ID" ] || exec yagura-daemon --emit-status waiting_input --source muse-code', timeout = 10 }] }], StopFailure = [{ hooks = [{ type = "command", command = '[ -z "$YAGURA_WINDOW_ID" ] || exec yagura-daemon --emit-status waiting_input --source muse-code', timeout = 10 }] }], Interrupt = [{ hooks = [{ type = "command", command = '[ -z "$YAGURA_WINDOW_ID" ] || exec yagura-daemon --emit-status waiting_input --source muse-code', timeout = 10, async = true }] }] }
