# Launches the Claude Code CLI directly. Requires `claude` to be resolvable
# on the daemon's PATH (or its extra bin directories on Windows).
# The launch options below follow `claude --help` (2.1.263). Model names change
# over time -- edit the aliases to match what your own CLI accepts.
schema = 1
display_name = "Claude Code"
detection = "claude-code"
# A subagent's hooks carry `agent_id`: its running and waiting for approval
# are the window's, and nothing else of it is.
subagent_pointer = "/agent_id"

[command]
default = ["claude"]

[model]
args = ["--model", "{value}"]

[model.aliases]
fast = "haiku"
default = "sonnet"
strong = "opus"
fable = "fable"

# A fixed list: edit it to match the models your own CLI accepts.
[model.choices]
values = ["haiku", "sonnet", "opus", "fable"]

# No aliases: this CLI's own levels are already short and pass through as given.
[effort]
args = ["--effort", "{value}"]

# The window's identity reaches the hooks and the MCP bridge as the credentials
# file's path in their arguments, not through the environment, so the CLIs
# the window's tools start do not inherit it.
[credentials]
mode = "launch"

[mcp]
config_file = '{"mcpServers":{"{server}":{"command":"${YAGURA_MCP_BRIDGE}","args":["--profile","claude-code","--credentials","{credentials_file}"]}}}'
args = ["--mcp-config", "{mcp_config_file}"]

# Each hook event calls the `--hook` door, which does what [hook_events] says
# for it, each door handed the credentials file (verified with Claude Code
# 2.1.285). The `--deliver-*` hooks read the window's inbox: the start-up
# context and a wait (`asyncRewake`) the daemon answers when something
# arrives for an idle session. When none is registered, the
# daemon writes the window's wake file, whose change (`FileChanged`, matched by
# its name) registers the wait again.
[hooks]
config_file = '''{"hooks":{"SessionStart":[{"hooks":[{"type":"command","command":"yagura-daemon --credentials '{credentials_file}' --deliver-context"},{"type":"command","command":"yagura-daemon --credentials '{credentials_file}' --deliver-wait","asyncRewake":true,"timeout":{hook_timeout.doors.wait}},{"type":"command","command":"yagura-daemon --credentials '{credentials_file}' --print-answer SessionStart"}]}],"UserPromptSubmit":[{"hooks":[{"type":"command","command":"yagura-daemon --credentials '{credentials_file}' --hook claude-code UserPromptSubmit"}]}],"PreToolUse":[{"hooks":[{"type":"command","command":"yagura-daemon --credentials '{credentials_file}' --hook claude-code PreToolUse"}]}],"PostToolUse":[{"hooks":[{"type":"command","command":"yagura-daemon --credentials '{credentials_file}' --hook claude-code PostToolUse"}]}],"PermissionRequest":[{"hooks":[{"type":"command","command":"yagura-daemon --credentials '{credentials_file}' --hook claude-code PermissionRequest"}]}],"Stop":[{"hooks":[{"type":"command","command":"yagura-daemon --credentials '{credentials_file}' --hook claude-code Stop"},{"type":"command","command":"yagura-daemon --credentials '{credentials_file}' --deliver-wait","asyncRewake":true,"timeout":{hook_timeout.doors.wait}}]}],"CwdChanged":[{"hooks":[{"type":"command","command":"yagura-daemon --credentials '{credentials_file}' --print-answer CwdChanged"}]}],"FileChanged":[{"matcher":"yagura_wake","hooks":[{"type":"command","command":"yagura-daemon --credentials '{credentials_file}' --deliver-wait","asyncRewake":true,"timeout":{hook_timeout.doors.wait}}]}],"StopFailure":[{"hooks":[{"type":"command","command":"yagura-daemon --credentials '{credentials_file}' --hook claude-code StopFailure"}]}]}}'''
args = ["--settings", "{hooks_config_file}"]

# What the window's open leaves beside its credentials file for the
# `--print-answer` hooks, which print it without asking the daemon: the wake
# file the CLI watches, handed over at start-up and again on each change of
# directory, so the list holds even while no daemon runs.
[hooks.answers]
SessionStart = '{"hookSpecificOutput":{"hookEventName":"SessionStart","watchPaths":{wake_paths}}}'
CwdChanged = '{"hookSpecificOutput":{"hookEventName":"CwdChanged","watchPaths":{wake_paths}}}'

# The seconds Claude Code gives a hook command that registers a `timeout`: the
# wait (`asyncRewake`) takes it in `[hooks]` through
# `{hook_timeout.doors.wait}`. The other doors register none, so the daemon
# names none for them and a door takes the time it had before revision 34.
[hook_timeout]
doors = { wait = 86400 }

# How the daemon hands text to this CLI without typing it into the composer.
# The launch prompt follows `--` because `--mcp-config` takes several values
# and would otherwise swallow it.
[delivery]
output = "plain"
max_bytes = 10000
wake = "wait"
wake_stream = "stderr"
wake_exit = 2
launch_prompt = ["--", "{prompt}"]

# Claude Code reports its own registrations as `Prefix: value` lines and
# accepts an environment pair per `-e`.
[mcp_registration]
add = ["mcp", "add", "--scope", "user", "{env_args}", "{server}", "--", "{bridge}", "--profile", "claude-code"]
remove = ["mcp", "remove", "--scope", "user", "{server}"]
env_arg = ["--env={env}"]

[mcp_registration.status]
args = ["mcp", "get", "{server}"]
format = "lines"
command = "Command:"
args_line = "Args:"
require = { "Scope:" = "User" }
absent = "No MCP server named"

# What each `--hook` door above does. A subagent's hooks carry `agent_id`: the
# daemon reports their running and waiting for approval, and does nothing else
# for them.
[hook_events]
UserPromptSubmit = { status = "running", deliver = "take" }
PreToolUse = { status = "running" }
PostToolUse = { status = "running" }
PermissionRequest = { status = "waiting_approval" }
Stop = { status = "waiting_input" }
StopFailure = { status = "waiting_input" }

# How the user and an AI stop the CLI. The user's own interrupt types Ctrl+C.
# An AI's marks the window's open turn, and the next tool call of that turn is
# answered with a stop. Both answers stop the tool and end the main session's
# turn, so a subagent's call after them is not stopped (measured).
[interrupt]
user_keys = ["ctrl_c"]
ai = "hook"

[interrupt.turn]
starts = ["UserPromptSubmit"]
ends = ["Stop", "StopFailure"]

[interrupt.stops.PreToolUse]
answer = '{"continue":false,"stopReason":{reason},"hookSpecificOutput":{"hookEventName":"PreToolUse","permissionDecision":"deny","permissionDecisionReason":{reason}}}'
ends_turn = true

[interrupt.stops.PostToolUse]
answer = '{"continue":false,"stopReason":{reason}}'
ends_turn = true
