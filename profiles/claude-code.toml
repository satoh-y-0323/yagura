# Launches the Claude Code CLI directly. Requires `claude` to be resolvable
# on the daemon's PATH (or its extra bin directories on Windows).
# The launch options below follow `claude --help` (2.1.263). Model names change
# over time -- edit the aliases to match what your own CLI accepts.
schema = 1
display_name = "Claude Code"
detection = "claude-code"

[command]
default = ["claude"]

[model]
args = ["--model", "{value}"]

[model.aliases]
fast = "haiku"
default = "sonnet"
strong = "opus"
fable = "fable"

# A fixed list: edit it to match the models your own CLI accepts.
[model.choices]
values = ["haiku", "sonnet", "opus", "fable"]

# No aliases: this CLI's own levels are already short and pass through as given.
[effort]
args = ["--effort", "{value}"]

[mcp]
config_file = '{"mcpServers":{"yagura":{"command":"${YAGURA_MCP_BRIDGE}","args":[]}}}'
args = ["--mcp-config", "{mcp_config_file}"]

# Each hook event reports the turn's start, a permission prompt, or its end to
# the daemon through the window's own environment (verified with Claude Code
# 2.1.285). The `--deliver-*` hooks read the window's inbox: the start-up
# context, the start of a turn, and a wait (`asyncRewake`) the daemon answers
# when something arrives for an idle session.
[hooks]
config_file = '{"hooks":{"SessionStart":[{"hooks":[{"type":"command","command":"yagura-daemon --deliver-context"},{"type":"command","command":"yagura-daemon --deliver-wait","asyncRewake":true,"timeout":86400}]}],"UserPromptSubmit":[{"hooks":[{"type":"command","command":"yagura-daemon --emit-status running --source claude-code"},{"type":"command","command":"yagura-daemon --deliver-take"}]}],"PreToolUse":[{"hooks":[{"type":"command","command":"yagura-daemon --emit-status running --source claude-code"}]}],"PostToolUse":[{"hooks":[{"type":"command","command":"yagura-daemon --emit-status running --source claude-code"}]}],"PermissionRequest":[{"hooks":[{"type":"command","command":"yagura-daemon --emit-status waiting_approval --source claude-code"}]}],"Stop":[{"hooks":[{"type":"command","command":"yagura-daemon --emit-status waiting_input --source claude-code"},{"type":"command","command":"yagura-daemon --deliver-wait","asyncRewake":true,"timeout":86400}]}],"StopFailure":[{"hooks":[{"type":"command","command":"yagura-daemon --emit-status waiting_input --source claude-code"}]}]}}'
args = ["--settings", "{hooks_config_file}"]

# How the daemon hands text to this CLI without typing it into the composer.
# The launch prompt follows `--` because `--mcp-config` takes several values
# and would otherwise swallow it.
[delivery]
output = "plain"
max_chars = 10000
wake = "wait"
wake_stream = "stderr"
wake_exit = 2
launch_prompt = ["--", "{prompt}"]

# Claude Code reports its own registrations as `Prefix: value` lines and
# accepts an environment pair per `-e`.
[mcp_registration]
add = ["mcp", "add", "--scope", "user", "{env_args}", "{server}", "--", "{bridge}"]
remove = ["mcp", "remove", "--scope", "user", "{server}"]
env_arg = ["--env={env}"]

[mcp_registration.status]
args = ["mcp", "get", "{server}"]
format = "lines"
command = "Command:"
require = { "Scope:" = "User" }
absent = "No MCP server named"
