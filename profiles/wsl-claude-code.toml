# Runs the Claude Code CLI inside a WSL distribution. Windows only: `wsl.exe` is
# an ordinary Windows program, and yagura starts it without rewriting the argv.
# The windows argv execs the CLI directly through a fixed wrapper
# (`bash -lic 'exec "$0" "$@"'`) without going through a shell, so this
# profile's launch-option values and the daemon's MCP injection arguments
# reach `claude`'s own argv unchanged. The shell is both a login and an
# interactive shell so `~/.bashrc` runs too, which is where a tool such as
# nvm adds its own install to `PATH`. See profiles/README.md
# "Launch options" and docs/wsl.md. This profile carries no argv for any other
# operating system -- on one, it does not appear in any listing and is not
# seeded, and naming it directly is refused as an unknown profile.
# The launch options below follow `claude --help` (2.1.263). Model names change
# over time -- edit the aliases to match what your own CLI accepts.
schema = 1
display_name = "WSL: Claude Code"
detection = "claude-code"
# A subagent's hooks carry `agent_id`: its running and waiting for approval
# are the window's, and nothing else of it is.
subagent_pointer = "/agent_id"

[command]
windows = ["wsl", "-e", "bash", "-lic", "exec \"$0\" \"$@\"", "claude"]

[model]
args = ["--model", "{value}"]

[model.aliases]
fast = "haiku"
default = "sonnet"
strong = "opus"
fable = "fable"

# A fixed list: edit it to match the models your own CLI accepts.
[model.choices]
values = ["haiku", "sonnet", "opus", "fable"]

# No aliases: this CLI's own levels are already short and pass through as given.
[effort]
args = ["--effort", "{value}"]

# The window's identity reaches the hooks and the MCP bridge as the credentials
# file's path in their arguments, not through the environment, so the CLIs
# the window's tools start do not inherit it.
[credentials]
mode = "launch"

[mcp]
args = ["--mcp-config", '{"mcpServers":{"{server}":{"command":"${YAGURA_MCP_BRIDGE}","args":["--profile","wsl-claude-code","--credentials","{credentials_file}"]}}}']

# Each hook event calls the `--hook` door, which does what [hook_events] says
# for it, each door handed the credentials file (verified with Claude Code
# 2.1.285). The wake file is asked for as in claude-code.toml.
# The JSON is inline so the launch hands the WSL CLI no path to convert, and
# the Windows executable is called by name because a Linux shell does not
# resolve the bare name.
[hooks]
args = ["--settings", '''{"hooks":{"SessionStart":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --deliver-context"},{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --deliver-wait","asyncRewake":true,"timeout":{hook_timeout.doors.wait}},{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --print-answer SessionStart"}]}],"UserPromptSubmit":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --hook wsl-claude-code UserPromptSubmit"}]}],"PreToolUse":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --hook wsl-claude-code PreToolUse"}]}],"PostToolUse":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --hook wsl-claude-code PostToolUse"}]}],"PermissionRequest":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --hook wsl-claude-code PermissionRequest"}]}],"Stop":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --hook wsl-claude-code Stop"},{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --deliver-wait","asyncRewake":true,"timeout":{hook_timeout.doors.wait}}]}],"CwdChanged":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --print-answer CwdChanged"}]}],"FileChanged":[{"matcher":"yagura_wake","hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --deliver-wait","asyncRewake":true,"timeout":{hook_timeout.doors.wait}}]}],"StopFailure":[{"hooks":[{"type":"command","command":"yagura-daemon.exe --credentials '{credentials_file}' --hook wsl-claude-code StopFailure"}]}]}}''']

# What the window's open leaves beside its credentials file for the
# `--print-answer` hooks, which print it without asking the daemon: the wake
# file the CLI watches, handed over at start-up and again on each change of
# directory, so the list holds even while no daemon runs.
[hooks.answers]
SessionStart = '{"hookSpecificOutput":{"hookEventName":"SessionStart","watchPaths":{wake_paths}}}'
CwdChanged = '{"hookSpecificOutput":{"hookEventName":"CwdChanged","watchPaths":{wake_paths}}}'

# The seconds Claude Code gives a hook command. The wait (`asyncRewake`)
# registers its `timeout` in `[hooks]` through `{hook_timeout.doors.wait}`.
# The other hooks register no `timeout`, so Claude Code's own applies: its
# documentation (https://code.claude.com/docs/en/hooks, the common field
# `timeout`) gives 600 seconds for a command hook, and 30 for
# `UserPromptSubmit`. The daemon names these to a door that asks.
[hook_timeout]
default = 600
doors = { wait = 86400 }
events = { UserPromptSubmit = 30 }

# How the daemon hands text to this CLI without typing it into the composer
# (see claude-code.toml).
[delivery]
output = "plain"
max_bytes = 10000
wake = "wait"
wake_stream = "stderr"
wake_exit = 2
launch_prompt = ["--", "{prompt}"]

# A Windows path is unreadable from the WSL CLI as it is. A launch names no
# path (the injections above are inline), so the one path converted with
# WSL's own tool first is the bridge a registration writes.
[host_paths]
convert = ["wsl", "-e", "wslpath", "-u", "{path}"]
# The guest's home as Windows reaches it: a window opened without a folder
# starts there, as a WSL terminal does.
home = ["wsl", "-e", "sh", "-c", 'wslpath -w "$HOME"']
# `{file}` is a positional argument to `sh`, resolved against $HOME inside
# the script -- never spliced into the script string itself.
read = ["wsl", "-e", "sh", "-c", 'f="$HOME/$1"; [ -e "$f" ] || exit 3; exec cat -- "$f"', "sh", "{file}"]
absent_exit = 3
# The guest's state folder, as the guest names it and as `wslpath -w` reaches
# it from Windows: the window's wake file goes under it.
state_base = ["wsl", "-e", "sh", "-c", 'b="${XDG_STATE_HOME:-$HOME/.local/state}"; printf "%s\n" "$b"; wslpath -w "$b"']

# The registration commands below run the same way any other window from
# this profile does: through the launch argv above, so they reach the same
# `claude` the login shell's `PATH` would find. The path conversion above
# and the file tool run as their own standalone `wsl` invocations instead,
# because they have nothing to do with launching the CLI itself.
[mcp_registration]
group = "WSL"
add = ["mcp", "add", "--scope", "user", "{env_args}", "{server}", "--", "{bridge}", "--profile", "wsl-claude-code"]
remove = ["mcp", "remove", "--scope", "user", "{server}"]
env_arg = ["--env={env}"]
env_forward = { name = "WSLENV", separator = ":" }

[mcp_registration.status]
args = ["mcp", "get", "{server}"]
format = "lines"
command = "Command:"
args_line = "Args:"
require = { "Scope:" = "User" }
absent = "No MCP server named"

# What each `--hook` door above does. A subagent's hooks carry `agent_id`: the
# daemon reports their running and waiting for approval, and does nothing else
# for them.
[hook_events]
UserPromptSubmit = { status = "running", deliver = "take" }
PreToolUse = { status = "running" }
PostToolUse = { status = "running" }
PermissionRequest = { status = "waiting_approval" }
Stop = { status = "waiting_input" }
StopFailure = { status = "waiting_input" }

# How the user and an AI stop the CLI. The user's own interrupt types Ctrl+C.
# An AI's marks the window's open turn, and the next tool call of that turn is
# answered with a stop. Both answers stop the tool and end the main session's
# turn, so a subagent's call after them is not stopped (measured).
[interrupt]
user_keys = ["ctrl_c"]
ai = "hook"

[interrupt.turn]
starts = ["UserPromptSubmit"]
ends = ["Stop", "StopFailure"]

[interrupt.stops.PreToolUse]
answer = '{"continue":false,"stopReason":{reason},"hookSpecificOutput":{"hookEventName":"PreToolUse","permissionDecision":"deny","permissionDecisionReason":{reason}}}'
ends_turn = true

[interrupt.stops.PostToolUse]
answer = '{"continue":false,"stopReason":{reason}}'
ends_turn = true
