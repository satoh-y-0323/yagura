# Runs the Antigravity CLI inside a WSL distribution. Windows only (see
# wsl-claude-code.toml for why this profile carries no other operating
# system's argv). The shell is both a login and an interactive shell so
# `~/.bashrc` runs too, which is where a tool such as nvm adds its own
# install to `PATH`.
# The launch options below follow `agy --help` (1.2.11). Model names change
# over time -- edit the aliases to match what your own account can run.
# No [effort] table: agy's --effort is refused alongside the effort-qualified
# ids `agy models` lists, so effort is selected through a [model] alias
# instead (see profiles/README.md).
# No [mcp] table: agy reads MCP servers only from its own global
# registration, not from a per-launch config (see profiles/README.md's MCP
# injection section).
schema = 1
display_name = "WSL: Antigravity CLI"
detection = "antigravity-cli"

# The outer bash puts the guest's root in the CLI's environment before it
# starts the CLI through the login shell: its own pid (the CLI keeps it through
# both execs), the boot, and its start time. The daemon judges a request
# against it (see [process_image]); the arguments the daemon appends reach the
# CLI unchanged.
[command]
windows = ["wsl", "-e", "bash", "-c", "unset YAGURA_GUEST_ROOT; if read -r s < /proc/$$/stat && read -r b < /proc/sys/kernel/random/boot_id; then g() { YAGURA_GUEST_ROOT=\"$$:$b:${20}\"; }; g ${s##*) }; export YAGURA_GUEST_ROOT; fi; unset -f g; unset s b; exec bash -lic 'exec \"$0\" \"$@\"' \"$0\" \"$@\"", "agy"]

[model]
args = ["--model", "{value}"]

[model.aliases]
fast = "gemini-3.8-flash-low"
default = "gemini-3.8-flash-medium"
strong = "gemini-3.1-pro-high"

# Listed by the CLI itself (`agy models`): one model per line, its id and
# display name separated by a tab.
[model.choices]
args = ["models"]
format = "lines"
separator = "\t"

# How the daemon hands text to this CLI without typing it into the composer.
# agy has no way to wake an idle session, so `wake` stays `none`.
[delivery]
output = { context = '{"injectSteps":[{"systemMessage":{"systemMessage":{text}}}]}', take = '{"injectSteps":[{"systemMessage":{"systemMessage":{text}}}]}', wait = '{"injectSteps":[{"systemMessage":{"systemMessage":{text}}}]}', block = '{"decision":"continue","reason":{text}}' }
max_bytes = 10000
wake = "none"
launch_prompt = ["-i", "{prompt}"]

# A Windows path is unreadable from the WSL CLI as it is. A launch names no
# path (this profile has no [mcp] or [hooks] table), so the paths converted with
# WSL's own tool first are the ones a registration writes: the bridge, and
# the daemon its hook entries run.
[host_paths]
convert = ["wsl", "-e", "wslpath", "-u", "{path}"]
# `{file}` is a positional argument to `sh`, resolved against $HOME inside
# the script -- never spliced into the script string itself. The replace
# tool follows a symlinked file to its target and keeps its mode, as in
# wsl-codex-cli.toml, but creates the file (and its directory) when it is
# not there yet: the hooks file need not exist before registration.
read = ["wsl", "-e", "sh", "-c", 'f="$HOME/$1"; [ -e "$f" ] || exit 3; exec cat -- "$f"', "sh", "{file}"]
replace = ["wsl", "-e", "sh", "-c", 'f="$HOME/$1"; if [ -e "$f" ]; then r=$(readlink -f -- "$f") || exit 1; else r="$f"; mkdir -p -- "$(dirname -- "$r")" || exit 1; fi; t=$(mktemp "$r.XXXXXX") || exit 1; if cat > "$t" && { [ ! -e "$r" ] || chmod --reference="$r" "$t"; } && mv -f -- "$t" "$r"; then exit 0; fi; rm -f -- "$t"; exit 1', "sh", "{file}"]
absent_exit = 3

# agy keeps its registrations in a settings file, not behind a status
# command, so the daemon reads that file through the read tool above rather
# than running a status command. The bridge is started through `bash -c`, which
# hands it what it collects of its lineage in the guest (as the hooks below do).
[mcp_registration]
group = "WSL"
add = ["mcp", "add", "{env_args}", "{server}", "--", "bash", "-c", 'set -- "$@" --guest-root "$YAGURA_GUEST_ROOT"; k() { r=${1##*) }; set -- $r; K="$2 ${20}"; }; c=$$; read -r x < /proc/$$/stat; n=0; while [ $n -lt 32 ]; do k "$x"; a=$K; q=${a%% *}; [ "$q" -gt 0 ] || break; read -r t < /proc/$q/stat || break; read -r u < /proc/$c/stat || break; k "$u"; [ "$K" = "$a" ] || break; set -- "$@" --guest-step "$t"; n=$((n+1)); case $YAGURA_GUEST_ROOT in "$q:"*) break;; esac; c=$q; x=$t; done; exec "$@"', "yagura-bridge", "{bridge}", "--profile", "wsl-antigravity-cli"]
remove = ["mcp", "remove", "{server}"]
env_arg = ["--env={env}"]
env_forward = { name = "WSLENV", separator = ":" }

[mcp_registration.status]
file = ".gemini/config/mcp_config.json"
format = "json"
command = "/mcpServers/{server}/command"
args_pointer = "/mcpServers/{server}/args"

# agy takes no hooks at launch, only from its own hooks file, so
# registration adds yagura's entry there and removal takes it out (checked
# with agy 1.2.14). PreToolUse is not used: agy requires a `decision` in its
# output. Stop takes no output as "stop", and continues the turn with a
# block's `reason` (checked with agy 1.5.7); only a stop of a turn that ended
# without a tool call, and the first stop of it (`executionNum` 0), is given
# one, so neither an interrupted turn nor a continuation is.
# Each hook calls `--hook wsl-antigravity-cli <Event>`; what an event does is the
# [hook_events] table below, so a daemon update never leaves this file stale.
# The hook's `sh` collects its lineage in the guest from its parent up and hands
# it to the door after the event (`--guest-root`, `--guest-step`), unread.
[mcp_registration.json_entry]
file = ".gemini/config/hooks.json"

[mcp_registration.json_entry.entries."{server}"]
PreInvocation = [{ type = "command", command = 'set --; k() { r=${1##*) }; set -- $r; K="$2 ${20}"; }; c=$$; read -r x < /proc/$$/stat; n=0; while [ $n -lt 32 ]; do k "$x"; a=$K; q=${a%% *}; [ "$q" -gt 0 ] || break; read -r t < /proc/$q/stat || break; read -r u < /proc/$c/stat || break; k "$u"; [ "$K" = "$a" ] || break; set -- "$@" --guest-step "$t"; n=$((n+1)); case $YAGURA_GUEST_ROOT in "$q:"*) break;; esac; c=$q; x=$t; done; exec {daemon} --for-instance {server} --hook wsl-antigravity-cli PreInvocation --guest-root "$YAGURA_GUEST_ROOT" "$@"', timeout = "{hook_timeout}" }]
SessionStart = [{ type = "command", command = 'set --; k() { r=${1##*) }; set -- $r; K="$2 ${20}"; }; c=$$; read -r x < /proc/$$/stat; n=0; while [ $n -lt 32 ]; do k "$x"; a=$K; q=${a%% *}; [ "$q" -gt 0 ] || break; read -r t < /proc/$q/stat || break; read -r u < /proc/$c/stat || break; k "$u"; [ "$K" = "$a" ] || break; set -- "$@" --guest-step "$t"; n=$((n+1)); case $YAGURA_GUEST_ROOT in "$q:"*) break;; esac; c=$q; x=$t; done; exec {daemon} --for-instance {server} --hook wsl-antigravity-cli SessionStart --guest-root "$YAGURA_GUEST_ROOT" "$@"', timeout = "{hook_timeout}" }]
PostToolUse = [{ matcher = "*", hooks = [{ type = "command", command = 'set --; k() { r=${1##*) }; set -- $r; K="$2 ${20}"; }; c=$$; read -r x < /proc/$$/stat; n=0; while [ $n -lt 32 ]; do k "$x"; a=$K; q=${a%% *}; [ "$q" -gt 0 ] || break; read -r t < /proc/$q/stat || break; read -r u < /proc/$c/stat || break; k "$u"; [ "$K" = "$a" ] || break; set -- "$@" --guest-step "$t"; n=$((n+1)); case $YAGURA_GUEST_ROOT in "$q:"*) break;; esac; c=$q; x=$t; done; exec {daemon} --for-instance {server} --hook wsl-antigravity-cli PostToolUse --guest-root "$YAGURA_GUEST_ROOT" "$@"', timeout = "{hook_timeout}" }] }]
Stop = [{ type = "command", command = 'set --; k() { r=${1##*) }; set -- $r; K="$2 ${20}"; }; c=$$; read -r x < /proc/$$/stat; n=0; while [ $n -lt 32 ]; do k "$x"; a=$K; q=${a%% *}; [ "$q" -gt 0 ] || break; read -r t < /proc/$q/stat || break; read -r u < /proc/$c/stat || break; k "$u"; [ "$K" = "$a" ] || break; set -- "$@" --guest-step "$t"; n=$((n+1)); case $YAGURA_GUEST_ROOT in "$q:"*) break;; esac; c=$q; x=$t; done; exec {daemon} --for-instance {server} --hook wsl-antigravity-cli Stop --guest-root "$YAGURA_GUEST_ROOT" "$@"', timeout = "{hook_timeout}" }]

# The name the guest's kernel keeps of the CLI's process from its start (the
# command name in its stat line, at most 15 bytes), which an update of the
# CLI's own file does not change. A request of a window is traced up the
# lineage it collected to the root the launch put in the CLI's environment:
# only one such process may stand between them. Measured with agy 1.5.6 in
# WSL (Ubuntu), started as ~/.local/bin/agy.
[process_image]
windows = "agy"

# The seconds this CLI gives a hook command. The registered entries name it
# through `{hook_timeout}`, and the daemon names it to a door that asks, so
# the two are one value.
[hook_timeout]
default = 10

[hook_events]
PreInvocation = { status = "running", deliver = "take" }
SessionStart = { deliver = "context" }
PostToolUse = { status = "running" }
Stop = { status = "waiting_input", deliver = "block", when = { "/terminationReason" = "NO_TOOL_CALL", "/executionNum" = 0 } }
