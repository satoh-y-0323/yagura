# Launches the GitHub Copilot CLI directly. Requires `copilot` to be
# resolvable on the daemon's PATH (or its extra bin directories on Windows).
# The launch options below follow `copilot --help` (1.0.101).
schema = 1
display_name = "GitHub Copilot CLI"
detection = "copilot-cli"
# A sub-agent's hooks carry `agentId`: the daemon reports their running and
# waiting for approval, and does nothing else for them.
subagent_pointer = "/agentId"

[command]
default = ["copilot"]

# Only `auto`: Copilot documents no model identifiers and no command that
# lists them, so any other name is passed through as given (or picked with
# the CLI's own /model).
[model]
args = ["--model", "{value}"]

[model.aliases]
default = "auto"

# No aliases: the levels `--help` lists pass through as given.
[effort]
args = ["--reasoning-effort", "{value}"]

# The window's identity reaches the hooks and the MCP bridge as the credentials
# file's path in their arguments, not through the environment, so the CLIs
# the window's tools start do not inherit it.
[credentials]
mode = "launch"

# `timeout` is in milliseconds (one day): Copilot cuts a tool call off after
# 180 seconds by default, which is shorter than the waits the tools allow.
[mcp]
config_file = '{"mcpServers":{"{server}":{"type":"local","command":"${YAGURA_MCP_BRIDGE}","args":["--profile","copilot-cli","--credentials","{credentials_file}"],"tools":["*"],"timeout":86400000}}}'
args = ["--additional-mcp-config", "@{mcp_config_file}"]

# Copilot takes launch-time hooks only from a plugin directory: a
# `plugin.json` naming the plugin and a `hooks.json` beside it. It loads them
# once the folder is trusted and runs `sessionStart` on the first prompt.
# The interrupted turn runs no hook, and the approval box is read from the
# screen. Checked with Copilot CLI 1.0.101 on Windows.
[hooks]
args = ["--plugin-dir", "{hooks_config_dir}"]

[hooks.config_dir]
"plugin.json" = '{"name":"yagura"}'
"hooks.json" = '''{"version":1,"hooks":{"sessionStart":[{"type":"command","bash":"yagura-daemon --credentials '{credentials_file}' --hook copilot-cli sessionStart","powershell":"yagura-daemon --credentials '{credentials_file}' --hook copilot-cli sessionStart"}],"userPromptSubmitted":[{"type":"command","bash":"yagura-daemon --credentials '{credentials_file}' --hook copilot-cli userPromptSubmitted","powershell":"yagura-daemon --credentials '{credentials_file}' --hook copilot-cli userPromptSubmitted"}],"preToolUse":[{"type":"command","bash":"yagura-daemon --credentials '{credentials_file}' --hook copilot-cli preToolUse","powershell":"yagura-daemon --credentials '{credentials_file}' --hook copilot-cli preToolUse"}],"postToolUse":[{"type":"command","bash":"yagura-daemon --credentials '{credentials_file}' --hook copilot-cli postToolUse","powershell":"yagura-daemon --credentials '{credentials_file}' --hook copilot-cli postToolUse"}],"postToolUseFailure":[{"type":"command","bash":"yagura-daemon --credentials '{credentials_file}' --hook copilot-cli postToolUseFailure","powershell":"yagura-daemon --credentials '{credentials_file}' --hook copilot-cli postToolUseFailure"}],"agentStop":[{"type":"command","bash":"yagura-daemon --credentials '{credentials_file}' --hook copilot-cli agentStop","powershell":"yagura-daemon --credentials '{credentials_file}' --hook copilot-cli agentStop"}]}}'''

# How the daemon hands text to this CLI without typing it into the composer.
# Copilot has no hook that fires on an idle session, so `wake` stays `none`.
[delivery]
max_bytes = 10000
wake = "none"
launch_prompt = ["-i", "{prompt}"]

[delivery.output]
context = '{"additionalContext":{text}}'
take = '{"additionalContext":{text}}'
wait = '{"additionalContext":{text}}'
block = '{"decision":"block","reason":{text}}'

# `copilot mcp get --json` prints one table keyed by the server's name.
[mcp_registration]
add = ["mcp", "add", "--timeout", "86400000", "{env_args}", "{server}", "--", "{bridge}", "--profile", "copilot-cli"]
remove = ["mcp", "remove", "{server}"]
env_arg = ["--env={env}"]

[mcp_registration.status]
args = ["mcp", "get", "{server}", "--json"]
format = "json"
command = "/{server}/command"
args_pointer = "/{server}/args"
absent = "not found"

# Read for every window this profile opens: the bridge registrations of the
# other instances are turned off for that window, so it shows no yagura but
# the one that opened it. `items` points at a table keyed by the server's
# name, so no `name` pointer is given.
[mcp_registration.list]
args = ["mcp", "list", "--json"]
items = "/mcpServers"
command = "/command"
disable = ["--disable-mcp-server", "{server}"]

# What each hook does is this table: the hooks above all call the `--hook`
# door. `agentStop` hands what waits over as a block, once per stop that is
# not a continuation (`stop_hook_active` is false), which makes Copilot go on
# with it.
[hook_events]
sessionStart = { deliver = "context" }
userPromptSubmitted = { status = "running" }
preToolUse = { status = "running" }
postToolUse = { status = "running", deliver = "take" }
postToolUseFailure = { status = "running" }
agentStop = { status = "waiting_input", deliver = "block", when = { "/stop_hook_active" = false } }

# How the user and an AI stop the CLI. The user's own interrupt types Ctrl+C.
# An AI's marks the window's open turn: every tool of that turn is denied
# until it ends, since a deny does not end Copilot's turn (measured).
[interrupt]
user_keys = ["ctrl_c"]
ai = "hook"

[interrupt.turn]
starts = ["userPromptSubmitted"]
ends = ["agentStop"]

[interrupt.stops.preToolUse]
answer = '{"permissionDecision":"deny","permissionDecisionReason":{reason}}'
ends_turn = false
