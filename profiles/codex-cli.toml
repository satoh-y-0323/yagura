# Launches the Codex CLI directly. Requires `codex` to be resolvable on the
# daemon's PATH (or its extra bin directories on Windows).
# The launch options below follow `codex --help` (0.153.4) and the Codex config
# reference. Model names change over time -- edit the aliases to match what
# your own account can run.
schema = 1
display_name = "Codex CLI"
detection = "codex-cli"

[command]
default = ["codex"]

[model]
args = ["-m", "{value}"]

[model.aliases]
fast = "gpt-5.6-luna"
default = "gpt-5.6-terra"
strong = "gpt-6-astra"

# Listed by the CLI itself (`codex debug models`, JSON). A `debug` command may
# change shape; if it does, edit the pointers below to follow it.
[model.choices]
args = ["debug", "models"]
format = "json"
items = "/models"
id = "/slug"
label = "/display_name"
filter = { pointer = "/visibility", equals = "list" }

# No aliases: the levels pass through as given into the -c key=value override.
[effort]
args = ["-c", "model_reasoning_effort={value}"]

# Codex keeps the credentials in its environment because a changed hook command
# would void the recorded trust hashes. The blank `set` values keep them out of
# the environment of the tools it runs. The values avoid `"` so the arguments
# also pass through a Windows `.cmd` shim.
[credentials]
mode = "env"
launch_args = [
  "-c", "shell_environment_policy.set.YAGURA_WINDOW_ID=''",
  "-c", "shell_environment_policy.set.YAGURA_STATUS_TOKEN=''",
]

[mcp]
args = [
  "-c", "mcp_servers.{server}.command={bridge_toml}",
  "-c", "mcp_servers.{server}.args=[]",
  "-c", "mcp_servers.{server}.env_vars={env_names_toml}",
  # Codex's own 60-second default would end a call before the daemon's deadlines do.
  "-c", "mcp_servers.{server}.tool_timeout_sec=86400",
]

# Each turn boundary runs the daemon's status report. Codex runs a
# command-line hook only once its trust is recorded in the user's own
# config (the `entries` of `[mcp_registration.toml_set]` below), so the
# daemon injects these only while that registration holds. Checked with
# codex 0.159.2 on Windows.
# Each hook calls `--hook codex-cli <Event>`; `additionalContextLimit` is the
# delivery table's `max_chars`.
[hooks]
args = [
  "-c", "hooks.SessionStart=[{hooks=[{type='command',command='yagura-daemon --hook codex-cli SessionStart',additionalContextLimit=10000}]}]",
  "-c", "hooks.UserPromptSubmit=[{hooks=[{type='command',command='yagura-daemon --hook codex-cli UserPromptSubmit',additionalContextLimit=10000}]}]",
  "-c", "hooks.PreToolUse=[{hooks=[{type='command',command='yagura-daemon --hook codex-cli PreToolUse'}]}]",
  "-c", "hooks.PostToolUse=[{hooks=[{type='command',command='yagura-daemon --hook codex-cli PostToolUse'}]}]",
  "-c", "hooks.PermissionRequest=[{hooks=[{type='command',command='yagura-daemon --hook codex-cli PermissionRequest'}]}]",
  "-c", "hooks.Stop=[{hooks=[{type='command',command='yagura-daemon --hook codex-cli Stop'}]}]",
  "-c", "hooks.Interrupt=[{hooks=[{type='command',command='yagura-daemon --hook codex-cli Interrupt'}]}]",
]

# How the daemon hands text to this CLI without typing it into the composer.
# A waiting CLI is woken by queueing a message on its session, which the
# `--report-session` hook above tells the daemon.
[delivery]
output = "plain"
max_chars = 10000
wake = "command"
wake_args = ["queue", "--thread", "{session}", "--message", "{text}"]
launch_prompt = ["{prompt}"]

# What to tell a user whose `codex` is the npm package's `.cmd` launcher.
[shim_guidance]
text = "Install the standalone Codex from a new PowerShell window, then restart yagura:"
command = 'powershell -ExecutionPolicy ByPass -c "irm https://chatgpt.com/codex/install.ps1 | iex"'
url = "https://learn.chatgpt.com/docs/codex/cli.md"

# `codex mcp add` rewrites the whole `[mcp_servers.<name>]` table, dropping
# any hand-written key -- including `tool_timeout_sec` -- so it is written
# back once as a settings-file edit right after add.
[mcp_registration]
add = ["mcp", "add", "{env_args}", "{server}", "--", "{bridge}"]
remove = ["mcp", "remove", "{server}"]
env_arg = ["--env={env}"]

[mcp_registration.status]
args = ["mcp", "get", "{server}", "--json"]
format = "json"
command = "/transport/command"
args_pointer = "/transport/args"
absent = "No MCP server named"

# Read for every window this profile opens: the bridge registrations of the
# other instances are turned off for that window, because the CLI passes the
# window only the variables its own configuration names, so a registration
# of another instance would connect it to that instance's daemon as an
# outside client. `items` points at the array, `name` and `command` at the
# fields read from each element.
[mcp_registration.list]
args = ["mcp", "list", "--json"]
items = ""
name = "/name"
command = "/transport/command"
disable = ["-c", "mcp_servers.{server}.enabled=false"]

[mcp_registration.toml_set]
file = ".codex/config.toml"
table = ["mcp_servers", "{server}"]
values = { tool_timeout_sec = 86400 }
confirm = { tool_timeout_sec = "/tool_timeout_sec" }

# The trust Codex needs before it runs the `[hooks]` above: one
# `hooks.state` key per hook, holding the hash Codex itself reports for
# it (`codex app-server`, request `hooks/list`). The `--hook` command does
# not change between releases; take the values again only when a hook's
# attributes change. `retired` keys are ones an earlier version wrote. The key
# names the command-line layer, whose path depends on the operating
# system Codex runs on.
[mcp_registration.toml_set.entries]
under = ["hooks", "state"]

[mcp_registration.toml_set.entries.windows]
'C:\<session-flags>\config.toml:user_prompt_submit:0:0' = { trusted_hash = "sha256:02032e0879a2fbddb9f0e2690072eceeb3b16c73f658405259f457079129f2e7" }
'C:\<session-flags>\config.toml:pre_tool_use:0:0' = { trusted_hash = "sha256:31260d38950fe330199fa666df200a3f53c54d4e4da1a0d1b9d84053b7f42466" }
'C:\<session-flags>\config.toml:post_tool_use:0:0' = { trusted_hash = "sha256:1be9973fde53b9993f850a41917392dbd9bb2402c950fccf16794427600925ee" }
'C:\<session-flags>\config.toml:permission_request:0:0' = { trusted_hash = "sha256:3fb04fe1cc776d675b8e4a998207258698706caa29c9cd303df61a060c9b1983" }
'C:\<session-flags>\config.toml:stop:0:0' = { trusted_hash = "sha256:eedecbdbf094978df724e83fa53dead35ccd572bf17413bd4d22a3dcb908870e" }
'C:\<session-flags>\config.toml:interrupt:0:0' = { trusted_hash = "sha256:a3859bc8069fc031b1f0565f704b051613089fa979fb50c20779080ac9ca4489" }
'C:\<session-flags>\config.toml:session_start:0:0' = { trusted_hash = "sha256:24fdd95ac846f2f040eb9080e25cf31fffec6f98ab4203fec6fa7142bf825446" }

[mcp_registration.toml_set.entries.default]
'/<session-flags>/config.toml:user_prompt_submit:0:0' = { trusted_hash = "sha256:02032e0879a2fbddb9f0e2690072eceeb3b16c73f658405259f457079129f2e7" }
'/<session-flags>/config.toml:pre_tool_use:0:0' = { trusted_hash = "sha256:31260d38950fe330199fa666df200a3f53c54d4e4da1a0d1b9d84053b7f42466" }
'/<session-flags>/config.toml:post_tool_use:0:0' = { trusted_hash = "sha256:1be9973fde53b9993f850a41917392dbd9bb2402c950fccf16794427600925ee" }
'/<session-flags>/config.toml:permission_request:0:0' = { trusted_hash = "sha256:3fb04fe1cc776d675b8e4a998207258698706caa29c9cd303df61a060c9b1983" }
'/<session-flags>/config.toml:stop:0:0' = { trusted_hash = "sha256:eedecbdbf094978df724e83fa53dead35ccd572bf17413bd4d22a3dcb908870e" }
'/<session-flags>/config.toml:interrupt:0:0' = { trusted_hash = "sha256:a3859bc8069fc031b1f0565f704b051613089fa979fb50c20779080ac9ca4489" }
'/<session-flags>/config.toml:session_start:0:0' = { trusted_hash = "sha256:24fdd95ac846f2f040eb9080e25cf31fffec6f98ab4203fec6fa7142bf825446" }

[mcp_registration.toml_set.entries.retired]
windows = [
  'C:\<session-flags>\config.toml:user_prompt_submit:0:1',
  'C:\<session-flags>\config.toml:user_prompt_submit:0:2',
]
default = [
  '/<session-flags>/config.toml:user_prompt_submit:0:1',
  '/<session-flags>/config.toml:user_prompt_submit:0:2',
]

[hook_events]
SessionStart = { deliver = "context" }
UserPromptSubmit = { status = "running", deliver = "take", session = "/session_id" }
PreToolUse = { status = "running" }
PostToolUse = { status = "running" }
PermissionRequest = { status = "waiting_approval" }
Stop = { status = "waiting_input" }
Interrupt = { status = "waiting_input" }
