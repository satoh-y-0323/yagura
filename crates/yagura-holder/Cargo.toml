[package]
name = "yagura-holder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# A part of the yagura app, shipped in its installers rather than released to crates.io.
publish = false
# The integration tests are one binary (tests/main.rs) rather than one per file.
autotests = false

[[bin]]
name = "yagura-holder"
path = "src/main.rs"

[[bin]]
name = "holder_child"
path = "src/bin/holder_child.rs"

# Tests only: acts out the fault a launch names. Not shipped.
[[bin]]
name = "holder_fault"
path = "src/bin/holder_fault.rs"

[dependencies]
yagura-os = { path = "../yagura-os" }
yagura-protocol = { path = "../yagura-protocol" }
yagura-term = { path = "../yagura-term" }
tokio.workspace = true

# `holder_child` only: the test fixture reads its terminal's size directly, so
# a test can see a resize reach the child. The holder itself reaches the OS
# through `yagura-os`; a `[[bin]]` cannot use dev-dependencies, hence these.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Console"] }

[dev-dependencies]
tokio.workspace = true
yagura-test-support = { path = "../yagura-test-support" }

[build-dependencies]
yagura-build-support = { path = "../yagura-build-support" }

[lints]
workspace = true

[[test]]
name = "holder"
path = "tests/main.rs"
