# Detection definition for the GitHub Copilot CLI (`copilot`).
#
# Vendor identity lives only in this filename and the `name` value below --
# never in the daemon's core types (project convention: vendor-neutral
# vocabulary).
schema_version = 1
name = "copilot-cli"
# Captured against GitHub Copilot CLI 1.0.101 on 2026-10-21 at 100x30; see
# tests/fixtures/copilot-cli/README.md for the extraction rule and fixture
# provenance. Three lines reach the composer row, the rule under it and the
# footer line; the approval boxes put their navigation hint second from the
# bottom. Anything taller would bring the conversation history into reach.
bottom_line_count = 3

[debounce]
confirm_ms = 300

# Command approval and folder trust are both a selection box whose hint row
# reads the same regardless of the question, so match that row (drawn inside
# the box's left border) rather than the box's wording. Highest priority:
# a numbered option row starts with the same glyph as the composer.
[[rules]]
status = "waiting_approval"
pattern = '(?i)^[│\s]{0,4}↑/↓ to navigate\b'
priority = 30
region = "bottom"

# The footer while a turn runs: `esc esc interrupt`, right after a prompt is
# sent `esc esc edit prompt`, and after a single Esc `esc again to interrupt`.
# The glyph before `Working` changes from frame to frame, so the rule does not
# depend on it.
[[rules]]
status = "running"
pattern = '\besc (esc (interrupt|edit prompt)|again to interrupt)\b'
priority = 20
region = "bottom"

# The composer row, waiting for the next instruction. Its footer changes
# with a draft (the sidebar hint disappears), so the row itself is read.
# Past prompts in the history start with a space, and the composer stays
# drawn while a turn runs, which the higher-priority rule covers. An
# interrupted turn returns here: the cancellation line stays in the history
# and is not a state of its own.
[[rules]]
status = "waiting_input"
pattern = '^❯( |$)'
priority = 10
region = "bottom"

# Identifies the composer so the daemon can read what has been typed before
# submitting. The marker omits the trailing space so an empty composer
# (glyph alone) still matches. A draft that wraps continues on rows indented
# by two spaces; reading them as the body keeps the marker row inside the
# bottom window however tall the draft is.
[composer]
marker = '^❯'
separator = " "
continuation_prefix = "  "

# A body and its submit key written back to back left the body unsent, so the
# submit waits for the default delay. Ctrl+U empties the whole composer,
# wrapped rows included, and does nothing in an empty one.
[input]
bracketed_paste = true
submit = "\r"
clear = "\u0015"
ready_hold_ms = 1500
submit_delay_ms = 800
delivery_confirm_ms = 8000
probe = "x"
