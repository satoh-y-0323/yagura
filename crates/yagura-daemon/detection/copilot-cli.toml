# Detection definition for the GitHub Copilot CLI (`copilot`).
#
# Vendor identity lives only in this filename and the `name` value below --
# never in the daemon's core types (project convention: vendor-neutral
# vocabulary).
schema_version = 1
name = "copilot-cli"
# Captured against GitHub Copilot CLI 1.0.101 on 2026-10-21 at 100x30; see
# tests/fixtures/copilot-cli/README.md for the extraction rule and fixture
# provenance. Three lines reach the composer's last row, the border under it
# and the footer line; the approval boxes put their navigation hint second
# from the bottom. Anything taller would bring the conversation history into
# reach.
bottom_line_count = 3

[debounce]
confirm_ms = 300

# Command approval and folder trust are both a selection box whose hint row
# reads the same regardless of the question, so match that row (drawn inside
# the box's left border) rather than the box's wording. Highest priority:
# a numbered option row starts with the same glyph as the composer. With the
# session sidebar open (`←`) each row starts with the sidebar up to its first
# `│`, and the box's own border follows it.
[[rules]]
status = "waiting_approval"
pattern = '(?i)^(?:[^│]*││\s{0,3}|[│\s]{0,4})↑/↓ to navigate\b'
priority = 30
region = "bottom"

# The footer while a turn runs: `esc esc interrupt`, right after a prompt is
# sent `esc esc edit prompt`, and after a single Esc `esc again to interrupt`.
# The glyph before `Working` changes from frame to frame, so the rule does not
# depend on it.
[[rules]]
status = "running"
pattern = '\besc (esc (interrupt|edit prompt)|again to interrupt)\b'
priority = 20
region = "bottom"

# Screens with no composer to type into, where a key is an action instead:
# the tabs other than Current (`tab` cycles them; their footer starts with
# `/ search · ` or reads `tab switch tabs`), and the session sidebar holding
# the focus (`←` twice; its footer offers `→ focus timeline`), where `n`
# starts a new session. The composer border is still drawn in the latter.
[[rules]]
status = "unknown"
pattern = '^\s{0,2}(?:/ search · |tab switch tabs\b)|→ focus timeline\b'
priority = 15
region = "bottom"

# The border that closes the composer, right above the footer, waiting for
# the next instruction. Copilot draws the composer as a band of half blocks
# when the terminal answered its color queries (the daemon answers them from
# the moment the window opens, with the default palettes the GUI last sent or
# else the built-in dark palette) and between two rules otherwise; this row
# is the bottom border in either. The composer stays drawn while a turn runs,
# which the higher-priority rule covers, and an interrupted turn returns
# here. Past prompts in the history are indented, so they never start a line
# with either border. With the session sidebar open the border follows the
# sidebar's first `│`; the sidebar's width follows the terminal's.
[[rules]]
status = "waiting_input"
pattern = '^(?:[^│]*│)?(?:─+|╹▀+)\s*$'
priority = 10
region = "bottom"

# Identifies the composer so the daemon can read what has been typed before
# submitting. In the half-block drawing the band's top row is the marker and
# every body row, wrapped ones included, starts with `┃ `; the `❯` row of the
# rule drawing is a marker as well, so a one-row draft reads in either. A
# draft that wraps in the rule drawing continues on rows indented by two
# spaces, which this prefix does not name: that composer reads as not
# observed, and the daemon does not write into it. With the session sidebar
# open every row starts with the sidebar up to its first `│`, and the composer
# is read from the right of it.
[composer]
marker = '^(?:╻▄+$|❯ ?)'
separator = ""
continuation_prefix = "┃ "
left_panel = '^[^│]*│'

# A body and its submit key written back to back left the body unsent, so the
# submit waits for the default delay. Ctrl+U empties the whole composer,
# wrapped rows included, and does nothing in an empty one.
[input]
bracketed_paste = true
submit = "\r"
clear = "\u0015"
ready_hold_ms = 1500
submit_delay_ms = 800
delivery_confirm_ms = 8000
probe = "x"
