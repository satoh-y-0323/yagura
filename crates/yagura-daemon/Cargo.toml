[package]
name = "yagura-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# A part of the yagura app, shipped in its installers rather than released to crates.io.
publish = false
# The integration tests are one binary (tests/main.rs) rather than one per file.
autotests = false

[[bin]]
name = "yagura-daemon"
path = "src/main.rs"

[[bin]]
name = "echo_child"
path = "src/bin/echo_child.rs"

[[bin]]
name = "hex_echo"
path = "src/bin/hex_echo.rs"

[[bin]]
name = "screen_load_child"
path = "src/bin/screen_load_child.rs"

[[bin]]
name = "env_probe"
path = "src/bin/env_probe.rs"

[[bin]]
name = "argv_probe"
path = "src/bin/argv_probe.rs"

[[bin]]
name = "ready_child"
path = "src/bin/ready_child.rs"

[[bin]]
name = "submit_child"
path = "src/bin/submit_child.rs"

[[bin]]
name = "capture_child"
path = "src/bin/capture_child.rs"

[[bin]]
name = "mcp_cli_stub"
path = "src/bin/mcp_cli_stub.rs"

[dependencies]
yagura-protocol = { path = "../yagura-protocol" }
# With `yagura-locale`, the only way this crate reaches the operating system:
# transport, endpoint protection, peer identity, process groups and randomness.
yagura-os = { path = "../yagura-os" }
# The operating-system layer's locale queries, kept out of `yagura-os` so the
# holder and the watcher do not link macOS's CoreFoundation.
yagura-locale = { path = "../yagura-locale" }
tokio.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
toml.workspace = true
toml_edit.workspace = true
regex.workspace = true
rusqlite.workspace = true
sha2.workspace = true
# The MCP server a relay session runs (`mcp`).
rmcp.workspace = true

[features]
# The daemon's own test seams, kept out of the shipped daemon's code: a read
# of the screen copy that panics (`DetectionEngine::poison_reading_after_calls`),
# a resize that fails (`PtySession::fail_next_resize`), a detection driver that
# panics (`WindowEntry::inject_detector_driver_panic`), the fault a window's
# holder is asked to act out (`DaemonConfig::holder_fault`) and the points of
# `fault_point` (`DaemonConfig::faults`, armed in a daemon process through
# `YAGURA_FAULT_POINT`): `handoff_deposited`, `write_fails`,
# `parcel_end_half_settled`, `task_report_half_written`, `writer_paused`,
# `chat_post_committed`, `before_send_commit`, `after_send_key` and
# `door_before_settle`. Enabled for this crate's own tests through the self
# dev-dependency below; never in a shipped build. The holder and the terminal
# model have no such feature.
fault-injection = []

[build-dependencies]
yagura-build-support = { path = "../yagura-build-support" }

[dev-dependencies]
yagura-daemon = { path = ".", features = ["fault-injection"] }
# `test-util` enables tokio::time::pause()/advance(), which the detector
# tests rely on for deterministic time-based assertions. Dev-only: the
# production binaries keep the workspace feature set.
tokio = { workspace = true, features = ["test-util"] }
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
# Shared test fixtures. Dev-only: `publish = false` and absent from
# the normal dependency graph, so it never reaches the shipped binaries.
yagura-test-support = { path = "../yagura-test-support" }
# The holder's terminal model, so a test can turn bytes into the copy of a
# screen the way a holder does. Dev-only: the shipped daemon has no terminal
# model of its own.
yagura-term = { path = "../yagura-term" }
# The terminal engine itself, for tests that measure its grid directly.
alacritty_terminal.workspace = true
# Character widths, for the tests that check the tables generated for the GUI.
unicode-width.workspace = true

# Windows-only, tests-only: the conhost-reaping regression test enumerates
# conhost.exe process IDs directly (via Toolhelp32Snapshot) as an independent
# check, so it does not exercise the production teardown mechanism it is meant
# to catch a regression in. Every production OS call of this crate goes
# through `yagura-os` or `yagura-locale`; this dev-dependency is a deliberate,
# test-only exception to that boundary, needed to build a test oracle independent of the
# mechanism it verifies, not a second production dependency on `windows`.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[[test]]
name = "daemon"
path = "tests/main.rs"
