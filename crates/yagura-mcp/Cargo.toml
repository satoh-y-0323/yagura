[package]
name = "yagura-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# A part of the yagura app, shipped in its installers rather than released to crates.io.
publish = false
# The integration tests are one binary (tests/main.rs) rather than one per file.
autotests = false

[dependencies]
yagura-protocol = { path = "../yagura-protocol" }
yagura-os = { path = "../yagura-os" }
# io-std: the relay speaks to its CLI over stdin and stdout.
tokio = { workspace = true, features = ["io-std"] }
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
serde_json.workspace = true
# Shared test fixtures. Dev-only: `publish = false` and absent from
# the normal dependency graph, so it never reaches the shipped relay.
yagura-test-support = { path = "../yagura-test-support" }

[lints]
workspace = true

[[test]]
name = "mcp"
path = "tests/main.rs"
