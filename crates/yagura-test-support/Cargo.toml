[package]
name = "yagura-test-support"
version.workspace = true
edition.workspace = true
# File::try_lock (the run directory's owner lock) is stable from 1.89.
rust-version = "1.89"
license.workspace = true
# Test-fixture crate: consumed only through the dev-dependencies of the other
# workspace members, so it is never released to crates.io.
publish = false
# The integration tests are one binary (tests/main.rs) rather than one per file.
autotests = false

[dependencies]
yagura-os = { path = "../yagura-os" }
yagura-protocol = { path = "../yagura-protocol" }
serde_json.workspace = true
# The relay fixture starts the relay as a child with piped stdio.
tokio = { workspace = true, features = ["process"] }

# What the wait on a process id probes a process with.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true

[dev-dependencies]
toml.workspace = true

[[test]]
name = "test_support"
path = "tests/main.rs"
