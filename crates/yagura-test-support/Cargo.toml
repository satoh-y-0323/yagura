[package]
name = "yagura-test-support"
version.workspace = true
edition.workspace = true
# File::try_lock (the run directory's owner lock) is stable from 1.89.
rust-version = "1.89"
license.workspace = true
# Test-fixture crate: consumed only through the dev-dependencies of the other
# workspace members, so it is never released to crates.io.
publish = false

[dependencies]
yagura-os = { path = "../yagura-os" }
yagura-protocol = { path = "../yagura-protocol" }
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true

[dev-dependencies]
toml.workspace = true
