[workspace]
members = [
    "crates/yagura-protocol",
    "crates/yagura-os",
    "crates/yagura-daemon",
    "crates/yagura-mcp",
    "crates/yagura-test-support",
    "crates/yagura-build-support",
    "gui/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
# rmcp 3.6.0 requires MSRV 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
anyhow = "1.0"
rmcp = { version = "3.7.0", features = ["server", "macros", "transport-io"] }
getrandom = "0.4"
# Unix implementation of the yagura-os boundary: direct libc calls
# (getuid, getpgid, setpgid, kill, SO_PEERCRED on Linux, getpeereid on macOS)
# behind `unsafe`/`SAFETY`, symmetric with the `windows` crate used by the
# Windows branch.
libc = "0.2"
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System"] }
tracing = "0.1"
tracing-subscriber = "0.3"
portable-pty = "0.8"
tauri = { version = "2.0", features = [] }
tauri-build = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-clipboard-manager = "2.0"
# The terminal model behind every window screen. `serde` stays off: nothing is
# serialized through it.
alacritty_terminal = { version = "=0.26.0", default-features = false }
# Width of a character, the same measure the terminal model uses.
unicode-width = "0.2"
# The lock around a window's terminal model: fair hand-off between the PTY
# reader and readers, and no poisoning. Already in the graph through
# alacritty_terminal.
parking_lot = "0.12"
toml = "0.8"
# Format-preserving edits of hand-written profile files. Held on the version
# `toml` uses, so validating and rewriting parse a file the same way.
toml_edit = "0.20"
regex = "1.10"
# `bundled` compiles SQLite from source so the daemon does not depend on a
# system SQLite being present on the user's machine.
rusqlite = { version = "0.40", features = ["bundled"] }
# Workspace-key room ids are derived from a `.git` path via sha256.
sha2 = "0.11"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
