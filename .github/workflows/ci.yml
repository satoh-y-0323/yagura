# NOTE: if a third-party action is added to this workflow in the future, it must be pinned to a commit SHA.
name: CI

# Manual-only: every check is run locally before pushing, so CI runs on workflow_dispatch only.
#
# To restore, put back these triggers alongside workflow_dispatch:
#   push:
#     branches: [main]
#     paths-ignore: &paths-ignore
#       - "**.md"
#       - "docs/**"
#   pull_request:
#     paths-ignore: *paths-ignore
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run type-check
      - run: npm test
      - run: npm run build:web
      # The failure criteria live in the script, which is also run by hand before a push.
      - run: python3 ../scripts/dep-audit/dep_audit.py --only npm
        env:
          GITHUB_TOKEN: ${{ github.token }}

  rust:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Debuginfo generation and linking dominate build time on Windows runners; CI needs no debug symbols.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Create placeholder frontend dist
        # tauri::generate_context! requires the frontendDist directory to exist at compile time.
        # It lives in the bin target (gui/src-tauri/src/main.rs), which cargo builds for clippy
        # and for test alike, so the placeholder is needed even though no test reads it.
        run: |
          New-Item -ItemType Directory -Force -Path gui/dist
          Set-Content -Path gui/dist/index.html -Value '<!doctype html><html><head><meta charset="utf-8"><title>ci placeholder</title></head><body></body></html>' -Encoding utf8
      - name: Create placeholder sidecar binaries
        # bundle.externalBin makes tauri-build resolve the staged sidecars (the daemon and the
        # MCP bridge) at cargo build time. clippy/test never execute the sidecars and CI does
        # not bundle, so empty placeholders are sufficient; real staging
        # (gui/scripts/prepare-sidecar.mjs) stays a local/bundle concern.
        run: |
          New-Item -ItemType Directory -Force -Path gui/src-tauri/binaries
          New-Item -ItemType File -Force -Path gui/src-tauri/binaries/yagura-daemon-x86_64-pc-windows-msvc.exe
          New-Item -ItemType File -Force -Path gui/src-tauri/binaries/yagura-mcp-x86_64-pc-windows-msvc.exe
      - name: Prepare rustup toolchain
        run: |
          rustup update stable
          rustup component add rustfmt clippy
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            target
            ~/.cargo/bin/cargo-audit.exe
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --workspace --tests --locked
      # Save right after the build so build artifacts carry over even if the test step times out.
      - uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            target
            ~/.cargo/bin/cargo-audit.exe
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --workspace --locked
      - name: Install cargo-audit if missing
        run: if (-not (Test-Path "$env:USERPROFILE\.cargo\bin\cargo-audit.exe")) { cargo install cargo-audit --version 0.22.2 --locked; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      # Same script as the gui job and the local check; it holds the failure criteria.
      - run: python scripts/dep-audit/dep_audit.py --only cargo
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Linux coverage for the yagura-os Unix implementation. Only the 5 non-GUI
  # crates run here; gui/src-tauri is desktop-bundling code the Windows `rust` job already covers
  # and this job does not need a frontendDist placeholder for.
  rust-linux:
    runs-on: ubuntu-latest
    # 30 min: a completed run on this same configuration took 16 minutes; the rest is headroom for rusqlite's bundled C build and a cold cache.
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare rustup toolchain
        run: |
          rustup update stable
          rustup component add clippy
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo clippy --all-targets -p yagura-protocol -p yagura-os -p yagura-daemon -p yagura-mcp -p yagura-test-support -- -D warnings
      # Save right after clippy so build artifacts carry over even if the test step times out.
      - uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo test -p yagura-protocol -p yagura-os -p yagura-daemon -p yagura-mcp -p yagura-test-support --locked

  # macOS coverage for the yagura-os macOS implementation. Mirrors rust-linux:
  # only the 5 non-GUI crates run here; gui/src-tauri is desktop-bundling code not covered by this
  # smoke job.
  rust-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare rustup toolchain
        run: |
          rustup update stable
          rustup component add clippy
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo clippy --all-targets -p yagura-protocol -p yagura-os -p yagura-daemon -p yagura-mcp -p yagura-test-support -- -D warnings
      # Save right after clippy so build artifacts carry over even if the test step times out.
      - uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo test -p yagura-protocol -p yagura-os -p yagura-daemon -p yagura-mcp -p yagura-test-support --locked
